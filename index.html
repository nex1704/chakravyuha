<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHAKRAVYUHA - Anthima Sandhana</title>


    <!-- HISTORIC / ANCIENT FONTS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet">


    <style>

        /* =================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =================================
           BODY
        ================================= */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px 15px;

            background:

                radial-gradient(
                    circle at center,
                    #332b20 0%,
                    #17130e 45%,
                    #080604 100%
                );

            color: #e7d5a3;

            font-family:
                "Cormorant Garamond",
                serif;

            position: relative;

            overflow: hidden;

        }


        /* =================================
           MYSTERIOUS CIRCLE
        ================================= */

        body::before {

            content: "";

            position: fixed;

            width: 650px;

            height: 650px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(212,175,55,0.12);

            box-shadow:

                0 0 35px
                rgba(212,175,55,0.06),

                0 0 100px
                rgba(212,175,55,0.03);

            animation:
                rotate 35s linear infinite;

            pointer-events: none;

        }


        @keyframes rotate {

            from {

                transform:
                    translate(-50%, -50%)
                    rotate(0deg);

            }

            to {

                transform:
                    translate(-50%, -50%)
                    rotate(360deg);

            }

        }


        /* =================================
           TOP DECORATION
        ================================= */

        body::after {

            content:
                "✦   ✧   ✦   ✧   ✦";

            position: fixed;

            top: 15px;

            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(212,175,55,0.25);

            font-family:
                "Cinzel", serif;

            font-size: 13px;

            letter-spacing: 10px;

            pointer-events: none;

        }


        /* =================================
           MAIN CONTAINER
        ================================= */

        .container {

            width: 95%;

            max-width: 560px;

            padding: 40px;

            background:

                linear-gradient(
                    145deg,
                    #292116,
                    #15110c
                );

            border:
                1px solid #8d7038;

            box-shadow:

                0 0 25px
                rgba(0,0,0,0.8),

                inset 0 0 50px
                rgba(0,0,0,0.6);

            position: relative;

            z-index: 2;

        }


        /* =================================
           DECORATIVE CORNERS
        ================================= */

        .container::before {

            content: "✦";

            position: absolute;

            top: 12px;

            left: 15px;

            color: #c9a85b;

            font-size: 22px;

        }


        .container::after {

            content: "✦";

            position: absolute;

            bottom: 12px;

            right: 15px;

            color: #c9a85b;

            font-size: 22px;

        }


        /* =================================
           SYMBOL
        ================================= */

        .symbol {

            text-align: center;

            font-family:
                "UnifrakturCook",
                cursive;

            font-size: 45px;

            color: #d2af63;

            margin-bottom: 2px;

            text-shadow:

                0 0 15px
                rgba(210,175,99,0.5);

        }


        /* =================================
           MAIN HISTORIC HEADING
        ================================= */

        h1
         {

            text-align: center;

            font-family:
                "UnifrakturCook",
                cursive;

            font-size: 55px;

            font-weight: 700;

            letter-spacing: 3px;

            color: #d9b96b;

            text-shadow:

                0 0 10px
                rgba(217,185,107,0.3),

                0 0 25px
                rgba(217,185,107,0.15);

        }


        /* =================================
           SUBHEADING
        ================================= */

        .subtitle {

            text-align: center;

            font-family:
                "Cinzel",
                serif;

            font-size: 19px;

            font-weight: 600;

            letter-spacing: 4px;

            color: #b6a37b;

            margin-top: 8px;

        }


        /* =================================
           DIVIDER
        ================================= */

        .line {

            width: 85%;

            height: 1px;

            margin: 25px auto;

            background:

                linear-gradient(
                    to right,
                    transparent,
                    #9b7a3d,
                    transparent
                );

        }


        /* =================================
           GAME BOX
        ================================= */

        .game {

            border:
                1px solid #5e4b2d;

            padding: 30px 25px;

            background:
                rgba(0,0,0,0.18);

            position: relative;

        }


        .game::before {

            content: "◆";

            position: absolute;

            top: -10px;

            left: 50%;

            transform:
                translateX(-50%);

            background: #19130b;

            padding: 0 12px;

            color: #c9a85b;

            font-size: 12px;

        }


        /* =================================
           GAME HEADING
        ================================= */

        h2 {

            text-align: center;

            color: #d0b36c;

            font-family:
                "Cinzel",
                serif;

            font-size: 18px;

            letter-spacing: 3px;

            margin-bottom: 10px;

        }


        .instruction {

            text-align: center;

            color: #8f8268;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        /* =================================
           INPUT
        ================================= */

        input {

            width: 100%;

            padding: 16px;

            background: #0d0b08;

            border:
                1px solid #6f5830;

            color: #e4ca8b;

            font-family:
                "Cinzel",
                serif;

            font-size: 17px;

            text-align: center;

            letter-spacing: 5px;

            outline: none;

            transition: 0.3s;

        }


        input::placeholder {

            color: #746951;

            font-family:
                "Cinzel",
                serif;

            font-size: 13px;

            letter-spacing: 2px;

        }


        input:focus {

            border-color: #c9a85b;

            box-shadow:

                0 0 15px
                rgba(201,168,91,0.2);

        }


        /* =================================
           DECODE BUTTON
        ================================= */

        .decode-btn {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            background:

                linear-gradient(
                    90deg,
                    #6c5225,
                    #a47d35,
                    #6c5225
                );

            border:
                1px solid #c5a55d;

            color: #fff1c5;

            font-family:
                "Cinzel",
                serif;

            font-size: 14px;

            letter-spacing: 3px;

            cursor: pointer;

            transition: 0.4s;

        }


        .decode-btn:hover {

            box-shadow:

                0 0 20px
                rgba(218,180,91,0.35);

            transform:
                translateY(-2px);

        }


        /* =================================
           RESULT
        ================================= */

        .result {

            margin-top: 25px;

            padding: 22px 15px;

            text-align: center;

            background:

                rgba(
                    156,
                    122,
                    48,
                    0.10
                );

            border:
                1px solid #9b7a3d;

            color: #e6c875;

            font-family:
                "UnifrakturCook",
                cursive;

            font-size: 32px;

            font-weight: 700;

            letter-spacing: 3px;

            text-shadow:

                0 0 12px
                rgba(212,175,55,0.4);

            animation:
                reveal 0.5s ease;

        }


        @keyframes reveal {

            from {

                opacity: 0;

                transform:
                    scale(0.95);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        /* =================================
           ERROR
        ================================= */

        .error {

            margin-top: 20px;

            text-align: center;

            color: #b96b5d;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 17px;

            font-weight: 600;

            letter-spacing: 1px;

        }


        /* =================================
           HIDDEN
        ================================= */

        .hidden {

            display: none;

        }


        /* =================================
           ADMIN LINK
        ================================= */

        .admin-link {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #746951;

            text-decoration: none;

            font-family:
                "Cinzel",
                serif;

            font-size: 11px;

            letter-spacing: 3px;

            transition: 0.3s;

        }


        .admin-link:hover {

            color: #d4af37;

            text-shadow:

                0 0 8px
                rgba(212,175,55,0.4);

        }


        /* =================================
           BOTTOM DECORATION
        ================================= */

        .bottom-symbol {

            text-align: center;

            margin-top: 22px;

            color: #514728;

            font-family:
                "Cinzel",
                serif;

            font-size: 12px;

            letter-spacing: 8px;

        }


        /* =================================
           MOBILE
        ================================= */

        @media(max-width: 600px) {

            .container {

                padding: 28px 20px;

            }


            h1 {

                font-size: 39px;

                letter-spacing: 2px;

            }


            .subtitle {

                font-size: 17px;

                letter-spacing: 3px;

            }


            .game {

                padding: 25px 18px;

            }


            .result {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- SYMBOL -->

    <div class="symbol">
        𑁍
    </div>


    <!-- TITLE -->

    <h1>
        CHAKRAVYUHA
    </h1>


    <!-- SUBTITLE -->

    <p class="subtitle">
        Anthima Sandhana
    </p>


    <div class="line"></div>


    <!-- GAME -->

    <div class="game">


        <h2>
            ✦ THE HIDDEN CODE ✦
        </h2>


        <p class="instruction">

            Enter the number entrusted to you
            <br>

            and unveil the hidden word.

        </p>


        <!-- PLAYER CODE -->

        <input
            type="text"
            id="playerCode"
            placeholder="ENTER SECRET NUMBER"
            autocomplete="off"
        >


        <!-- DECODE -->

        <button
            class="decode-btn"
            onclick="decodeCode()"
        >

            ⚔ DECODE THE SECRET

        </button>


        <!-- RESULT -->

        <div
            id="result"
            class="result hidden"
        ></div>


        <!-- ERROR -->

        <p
            id="error"
            class="error"
        ></p>


    </div>


    <!-- ADMIN -->

    <a
        href="admin.html"
        class="admin-link"
    >

        ⚿ ADMIN ACCESS

    </a>


    <!-- BOTTOM -->

    <div class="bottom-symbol">

        ✦ ─── ✧ ─── ✦

    </div>


</div>



<script>


    // ====================================
    // GET REGISTERED SECRETS
    // ====================================

    function getSecrets() {

        const data =
            localStorage.getItem("secretPairs");

        if (!data) {

            return [];

        }

        return JSON.parse(data);

    }



    // ====================================
    // DECODE CODE
    // ====================================

    function decodeCode() {


        const code =
            document
            .getElementById("playerCode")
            .value
            .trim();


        const result =
            document
            .getElementById("result");


        const error =
            document
            .getElementById("error");


        // CLEAR PREVIOUS RESULT

        result.classList.add("hidden");

        result.innerText = "";

        error.innerText = "";


        // EMPTY CHECK

        if (code === "") {

            error.innerText =
                "✦ Please enter the secret number. ✦";

            return;

        }


        // NUMBERS ONLY

        if (!/^\d+$/.test(code)) {

            error.innerText =
                "✦ Please enter numbers only. ✦";

            return;

        }


        // GET REGISTERED SECRETS

        const secrets =
            getSecrets();


        // FIND MATCHING CODE

        const found =
            secrets.find(
                item =>
                    item.number === code
            );


        // CORRECT CODE

        if (found) {

            result.innerText =
                "✦ " +
                found.word +
                " ✦";

            result.classList.remove(
                "hidden"
            );

        }


        // INCORRECT CODE

        else {

            error.innerText =
                "✖ THE NUMBER IS NOT CORRECT — TRY AGAIN.";

        }

    }



    // ====================================
    // ENTER KEY
    // ====================================

    document
        .getElementById("playerCode")
        .addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    decodeCode();

                }

            }
        );


</script>


</body>

</html>
