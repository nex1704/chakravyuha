<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Custodian's Chamber</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap');


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #332b20 0%,
                    #17130e 45%,
                    #080604 100%
                );

            color: #e7d5a3;

            font-family: 'Cinzel', serif;

            padding: 30px 15px;

        }


        /* GOLDEN GLOW */

        body::before {

            content: "";

            position: fixed;

            width: 700px;
            height: 700px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(211,171,85,0.07),
                    transparent 65%
                );

            pointer-events: none;

        }


        .container {

            width: 95%;

            max-width: 900px;

            margin: auto;

            padding: 40px;

            background:
                linear-gradient(
                    145deg,
                    #292116,
                    #15110c
                );

            border: 1px solid #8d7038;

            box-shadow:
                0 0 25px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.6);

            position: relative;

        }


        /* CORNERS */

        .container::before,
        .container::after {

            content: "✦";

            position: absolute;

            color: #c9a85b;

            font-size: 25px;

        }


        .container::before {

            top: 12px;

            left: 15px;

        }


        .container::after {

            bottom: 12px;

            right: 15px;

        }


        /* HEADER */

        .symbol {

            text-align: center;

            font-size: 45px;

            color: #d2af63;

            text-shadow:
                0 0 15px rgba(210,175,99,0.5);

        }


        h1 {

            text-align: center;

            font-family:
                'UnifrakturCook',
                cursive;

            font-size: 48px;

            color: #d9b96b;

            margin-top: 5px;

            text-shadow:
                0 0 10px
                rgba(217,185,107,0.25);

        }


        .subtitle {

            text-align: center;

            font-size: 13px;

            letter-spacing: 3px;

            color: #a99773;

            margin-top: 8px;

        }


        .line {

            width: 80%;

            height: 1px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #9b7a3d,
                    transparent
                );

            margin: 25px auto;

        }


        /* LOGIN */

        .login {

            max-width: 450px;

            margin: auto;

            text-align: center;

        }


        h2 {

            color: #d0b36c;

            font-size: 18px;

            letter-spacing: 3px;

            margin-bottom: 15px;

        }


        .description {

            color: #8f8268;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 20px;

        }


        input {

            width: 100%;

            padding: 15px;

            margin: 8px 0;

            background: #0d0b08;

            border: 1px solid #6f5830;

            color: #e4ca8b;

            font-family: 'Cinzel', serif;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            border-color: #c9a85b;

            box-shadow:
                0 0 15px
                rgba(201,168,91,0.2);

        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            background:
                linear-gradient(
                    90deg,
                    #6c5225,
                    #a47d35,
                    #6c5225
                );

            border: 1px solid #c5a55d;

            color: #fff1c5;

            font-family: 'Cinzel', serif;

            font-size: 14px;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.4s;

        }


        button:hover {

            box-shadow:
                0 0 20px
                rgba(218,180,91,0.35);

            transform: translateY(-2px);

        }


        /* ADMIN PANEL */

        .admin-panel {

            margin-top: 20px;

        }


        .section {

            border: 1px solid #5e4b2d;

            padding: 25px;

            margin-top: 20px;

            background:
                rgba(0,0,0,0.15);

        }


        .section-title {

            color: #d0b36c;

            font-size: 17px;

            letter-spacing: 2px;

            margin-bottom: 18px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .register-btn {

            margin-top: 15px;

        }


        /* MESSAGE */

        .message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            letter-spacing: 1px;

        }


        .success {

            color: #b7c987;

        }


        .error {

            color: #b96b5d;

        }


        /* TABLE */

        .table-container {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

        }


        th {

            background: #4d3b20;

            color: #e2c57d;

            padding: 14px;

            border: 1px solid #70572d;

            letter-spacing: 1px;

        }


        td {

            padding: 13px;

            border: 1px solid #493a25;

            color: #cdbd96;

            text-align: center;

        }


        tr:hover td {

            background: rgba(
                180,
                145,
                70,
                0.06
            );

        }


        .delete-btn {

            width: auto;

            padding: 8px 15px;

            margin: 0;

            background: #572b25;

            border-color: #8d4c40;

            font-size: 12px;

        }


        .delete-btn:hover {

            background: #73362d;

        }


        /* BOTTOM BUTTONS */

        .bottom-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

            margin-top: 20px;

        }


        .player-btn {

            background:
                linear-gradient(
                    90deg,
                    #3e4c35,
                    #596b46,
                    #3e4c35
                );

        }


        .logout-btn {

            background:
                linear-gradient(
                    90deg,
                    #542c27,
                    #743b32,
                    #542c27
                );

        }


        .hidden {

            display: none;

        }


        /* MOBILE */

        @media(max-width: 600px) {

            .container {

                padding: 25px 18px;

            }


            h1 {

                font-size: 36px;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .bottom-buttons {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="symbol">
        ⚿
    </div>


    <h1>
        The Custodian's Chamber
    </h1>


    <p class="subtitle">
        WHERE THE SECRETS ARE KEPT
    </p>


    <div class="line"></div>


    <!-- LOGIN SECTION -->

    <div
        id="loginSection"
        class="login"
    >

        <h2>
            ✦ ENTER THE CUSTODIAN'S KEY ✦
        </h2>


        <p class="description">

            Only the keeper of the cipher
            may enter this chamber.

            <br>

            The secrets await...

        </p>


        <input
            type="password"
            id="password"
            placeholder="Enter the secret password"
        >


        <button onclick="login()">

            🔐 ENTER THE CHAMBER

        </button>


        <p
            id="loginMessage"
            class="message"
        ></p>

    </div>


    <!-- ADMIN PANEL -->

    <div
        id="adminPanel"
        class="admin-panel hidden"
    >


        <!-- ADD SECRET -->

        <div class="section">


            <div class="section-title">

                ✦ INSCRIBE A NEW SECRET

            </div>


            <div class="form-grid">


                <input
                    type="text"
                    id="number"
                    placeholder="Enter code"
                >


                <input
                    type="text"
                    id="word"
                    placeholder="Enter secret word"
                >


            </div>


            <button
                class="register-btn"
                onclick="addSecret()"
            >

                ✦ SEAL THE SECRET

            </button>


            <p
                id="message"
                class="message"
            ></p>


        </div>


        <!-- REGISTERED SECRETS -->

        <div class="section">


            <div class="section-title">

                📜 THE BOOK OF SECRETS

            </div>


            <p class="description">

                These are the codes entrusted
                to the Custodian.

            </p>


            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                CODE
                            </th>

                            <th>
                                SECRET WORD
                            </th>

                            <th>
                                ACTION
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="secretTable"
                    >

                    </tbody>


                </table>


            </div>


        </div>


        <!-- BUTTONS -->

        <div class="bottom-buttons">


            <button
                class="player-btn"
                onclick="openPlayer()"
            >

                🎮 OPEN PLAYER PAGE

            </button>


            <button
                class="logout-btn"
                onclick="logout()"
            >

                🔒 CLOSE CHAMBER

            </button>


        </div>


    </div>


</div>


<script>


    // ====================================
    // ADMIN PASSWORD
    // ====================================

    const ADMIN_PASSWORD =
        "admin123";



    // ====================================
    // LOGIN
    // ====================================

    function login() {


        const password =
            document
            .getElementById("password")
            .value;


        if (
            password ===
            ADMIN_PASSWORD
        ) {


            document
            .getElementById("loginSection")
            .classList.add("hidden");


            document
            .getElementById("adminPanel")
            .classList.remove("hidden");


            loadSecrets();


        }

        else {


            const message =
                document
                .getElementById("loginMessage");


            message.innerText =
                "✦ The key is not recognized... ✦";


            message.className =
                "message error";


        }

    }



    // ====================================
    // GET SECRETS
    // ====================================

    function getSecrets() {


        const data =
            localStorage
            .getItem("secretPairs");


        if (!data) {

            return [];

        }


        return JSON.parse(data);

    }



    // ====================================
    // ADD SECRET
    // ====================================

    function addSecret() {


        const number =
            document
            .getElementById("number")
            .value
            .trim();


        const word =
            document
            .getElementById("word")
            .value
            .trim()
            .toUpperCase();


        const message =
            document
            .getElementById("message");


        // Empty check

        if (
            number === "" ||
            word === ""
        ) {


            message.innerText =
                "✦ Every secret requires a code and a word. ✦";


            message.className =
                "message error";


            return;

        }


        // Get existing data

        let secrets =
            getSecrets();


        // Check duplicate

        const exists =
            secrets.some(
                item =>
                item.number === number
            );


        if (exists) {


            message.innerText =
                "✦ This code is already sealed in the book. ✦";


            message.className =
                "message error";


            return;

        }


        // Add secret

        secrets.push({

            number: number,

            word: word

        });


        // Save

        localStorage.setItem(

            "secretPairs",

            JSON.stringify(secrets)

        );


        // Success message

        message.innerText =
            "✦ The secret has been sealed. ✦";


        message.className =
            "message success";


        // Clear inputs

        document
        .getElementById("number")
        .value = "";


        document
        .getElementById("word")
        .value = "";


        loadSecrets();

    }



    // ====================================
    // LOAD SECRETS
    // ====================================

    function loadSecrets() {


        const secrets =
            getSecrets();


        const table =
            document
            .getElementById("secretTable");


        table.innerHTML = "";


        if (
            secrets.length === 0
        ) {


            table.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                    >

                        The book of secrets
                        is empty...

                    </td>

                </tr>

            `;


            return;

        }


        secrets.forEach(
            (item, index) => {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${item.number}
                    </td>

                    <td>
                        ${item.word}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteSecret(${index})"
                        >

                            ✕ Remove

                        </button>

                    </td>

                `;


                table.appendChild(row);


            }
        );

    }



    // ====================================
    // DELETE SECRET
    // ====================================

    function deleteSecret(index) {


        const confirmDelete =
            confirm(
                "Are you certain you wish to erase this secret?"
            );


        if (!confirmDelete) {

            return;

        }


        let secrets =
            getSecrets();


        secrets.splice(
            index,
            1
        );


        localStorage.setItem(

            "secretPairs",

            JSON.stringify(secrets)

        );


        loadSecrets();

    }



    // ====================================
    // OPEN PLAYER PAGE
    // ====================================

    function openPlayer() {

        window.location.href =
            "index.html";

    }



    // ====================================
    // LOGOUT
    // ====================================

    function logout() {


        document
        .getElementById("adminPanel")
        .classList.add("hidden");


        document
        .getElementById("loginSection")
        .classList.remove("hidden");


        document
        .getElementById("password")
        .value = "";


    }

</script>


</body>

</html>
